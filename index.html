<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FizLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive physics simulations, lessons and quizzes for elementary school, in English and Croatian.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">

<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#home" id="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="var(--accent)" stroke-width="2.5" transform="rotate(-30 24 24)"/>
        <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="var(--accent)" stroke-width="2.5" transform="rotate(30 24 24)"/>
        <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="var(--line)" stroke-width="2.5" transform="rotate(90 24 24)"/>
        <circle cx="24" cy="24" r="5" fill="var(--accent2)"/>
        <circle cx="41" cy="14" r="3" fill="var(--c8)"/>
      </svg>
      <span class="brand-name">FizLab</span>
      <span class="brand-tag" data-i18n="tagline"></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="top-tools">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="is-active">EN</button>
        <button type="button" data-lang="hr">HR</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="app" id="app">
  <aside class="rail" id="rail"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
